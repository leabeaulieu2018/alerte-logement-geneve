# ---------------------------------------------------------------
# Critères (repris de ton lien immobilier.ch)
# ---------------------------------------------------------------
criteres:
  loyer_min: 1000
  loyer_max: 1600
  # Ville de Genève = NPA 1201 à 1209. Ajoute d'autres NPA si tu veux élargir (ex. 1227 Carouge).
  npa: [1201, 1202, 1203, 1204, 1205, 1206, 1207, 1208, 1209]
  pieces_min: null      # ex. 2
  pieces_max: null
  types: [appartement, maison, studio]

# Au tout premier passage, l'agent mémorise les annonces déjà en ligne sans t'envoyer de mail.
# Mets true si tu veux recevoir aussi celles qui existent déjà.
envoyer_au_premier_passage: true

# ---------------------------------------------------------------
